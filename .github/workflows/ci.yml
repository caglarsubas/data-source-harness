name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "schemas/**"
      - "contracts/**"
      - "compatibility/**"
      - "deployment/**"
      - "docs/**"
      - "reference-labs/**"
      - "reference_labs/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  pull_request:

permissions:
  contents: read

jobs:
  certification:
    name: Phase 0+1+2+3 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run harness-contracts validate
      - run: uv run harness-contracts phase0-gate --output phase0-report.json
      - run: uv build
      - name: Verify isolated wheel and embedded offline resources
        run: >-
          uv run --no-project --isolated
          --with ./dist/orchestra_data_source_harness-0.4.0-py3-none-any.whl
          python -c 'from importlib.resources import files; import data_source_harness as h;
          root = files("data_source_harness");
          assert h.__version__ == "0.4.0";
          assert (root / "resources/schemas/v1/data-batch.schema.json").is_file();
          assert (root / "resources/schemas/v1/promotion-readiness.schema.json").is_file()'
      - run: uv run python -m reference_labs.white_goods.certify --output phase1-report.json
      - run: uv run python -m reference_labs.white_goods.certify_phase2 --output phase2-report.json
      - run: uv run python -m reference_labs.white_goods.bundle build
      - run: uv run python -m reference_labs.white_goods.bundle verify
      - run: uv run python -m reference_labs.cold_chain.certify --output phase3-report.json
      - run: uv run python -m reference_labs.cold_chain.bundle build
      - run: uv run python -m reference_labs.cold_chain.bundle verify
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-phase1-phase2-phase3-python-${{ matrix.python-version }}
          path: |
            phase0-report.json
            phase1-report.json
            phase2-report.json
            phase3-report.json
            dist/*
