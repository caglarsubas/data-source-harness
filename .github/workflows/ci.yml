name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "schemas/**"
      - "contracts/**"
      - "compatibility/**"
      - "deployment/**"
      - "docs/**"
      - "reference-labs/**"
      - "reference_labs/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  pull_request:

permissions:
  contents: read

jobs:
  certification:
    name: Phase 0+1+2+3+4+5+6+6.5 + Phase 7 local readiness / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --cov=data_source_harness --cov-branch --cov-report=term-missing --cov-fail-under=85
      - run: uv run harness-contracts validate
      - run: uv run python scripts/check-local-only.py
      - run: uv run harness-contracts phase0-gate --output phase0-report.json
      - run: uv build
      - name: Verify isolated wheel and embedded offline resources
        run: >-
          uv run --no-project --isolated
          --with ./dist/orchestra_data_source_harness-0.13.0-py3-none-any.whl
          python -c 'from importlib.resources import files; import data_source_harness as h;
          root = files("data_source_harness");
          assert h.__version__ == "0.13.0";
          assert (root / "resources/schemas/v1/data-batch.schema.json").is_file();
          assert (root / "resources/schemas/v1/connector-worker-profile.schema.json").is_file();
          assert (root / "resources/schemas/v1/live-acceptance-campaign.schema.json").is_file();
          assert (root / "resources/schemas/v1/local-source-evidence.schema.json").is_file();
          assert (root / "resources/schemas/v1/local-cross-plane-evidence.schema.json").is_file();
          assert (root / "resources/schemas/v1/local-harness-runtime-evidence.schema.json").is_file();
          assert (root / "resources/deployment/profiles/local-laptop.json").is_file()'
      - run: >-
          uv run --no-project --isolated
          --with ./dist/orchestra_data_source_harness-0.13.0-py3-none-any.whl
          harness-contracts validate
      - run: uv run python -m reference_labs.white_goods.certify --output phase1-report.json
      - run: uv run python -m reference_labs.white_goods.certify_phase2 --output phase2-report.json
      - run: uv run python -m reference_labs.white_goods.bundle build
      - run: uv run python -m reference_labs.white_goods.bundle verify
      - run: uv run python -m reference_labs.cold_chain.certify --output phase3-report.json
      - run: uv run python -m reference_labs.cold_chain.bundle build
      - run: uv run python -m reference_labs.cold_chain.bundle verify
      - run: uv run python -m reference_labs.certify_phase4 --output phase4-report.json
      - run: uv run python -m reference_labs.certify_phase5 --output phase5-report.json
      - run: uv run python -m reference_labs.certify_phase6 --output phase6-report.json
      - run: bash scripts/build-airgap-wheelhouse.sh
      - run: uv run python -m reference_labs.certify_phase6_5 --output phase6.5-report.json
      - run: uv run python -m reference_labs.certify_phase7_readiness --output phase7-readiness-report.json
      - run: uv run python -m reference_labs.white_goods.runtime_bundle verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-through-phase7-readiness-python-${{ matrix.python-version }}
          path: |
            phase0-report.json
            phase1-report.json
            phase2-report.json
            phase3-report.json
            phase4-report.json
            phase5-report.json
            phase6-report.json
            phase6.5-report.json
            phase7-readiness-report.json
            dist/*
