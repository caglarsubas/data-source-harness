services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: whitegoods
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only-not-production
    volumes:
      - ./technology/postgresql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    networks: [lab-internal]
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: server /data
    environment:
      MINIO_ROOT_USER: lab
      MINIO_ROOT_PASSWORD: lab-only-not-production
    networks: [lab-internal]
  redpanda:
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:latest}
    command: redpanda start --smp 1 --memory 512M --overprovisioned --check=false
    networks: [lab-internal]
  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:latest}
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    networks: [lab-internal]
networks:
  lab-internal:
    internal: true
