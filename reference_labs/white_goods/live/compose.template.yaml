name: white-goods-phase7-local

services:
  postgresql:
    image: ${PHASE7_POSTGRES_IMAGE:?set an approved image by digest}
    pull_policy: never
    profiles: [phase7-local]
    environment:
      POSTGRES_DB: whitegoods
      POSTGRES_USER_FILE: /run/secrets/postgres-user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-user, postgres-password]
    volumes:
      - ../technology/postgresql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./postgresql-seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ../data:/fixtures:ro
    networks: [lab-internal]
    healthcheck:
      test: [CMD-SHELL, pg_isready -d whitegoods]
      interval: 10s
      timeout: 5s
      retries: 12

  object-store:
    image: ${PHASE7_MINIO_IMAGE:?set an approved image by digest}
    pull_policy: never
    profiles: [phase7-local]
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/object-store-user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/object-store-password
    secrets: [object-store-user, object-store-password]
    volumes:
      - ../data/documents:/fixtures:ro
    networks: [lab-internal]
    healthcheck:
      test: [CMD-SHELL, curl --fail --silent http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20

  event-stream:
    image: ${PHASE7_REDPANDA_IMAGE:?set an approved image by digest}
    pull_policy: never
    profiles: [phase7-local]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --default-log-level
      - warn
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://event-stream:9092
    volumes:
      - ../data/events/telemetry.jsonl:/fixtures/telemetry.jsonl:ro
    networks: [lab-internal]
    healthcheck:
      test: [CMD, rpk, cluster, info, -X, brokers=localhost:9092]
      interval: 5s
      timeout: 5s
      retries: 30

  service-api:
    image: ${PHASE7_SERVICE_API_IMAGE:?set an approved image by digest}
    pull_policy: never
    profiles: [phase7-local]
    environment:
      SERVICE_API_CREDENTIAL_FILE: /run/secrets/service-api-credential
      SERVICE_API_CONTRACT: /contracts/openapi.yaml
      SERVICE_API_FIXTURES: /opt/white-goods-service-api/fixtures.json
    secrets: [service-api-credential]
    volumes:
      - ../technology/service-api/openapi.yaml:/contracts/openapi.yaml:ro
    networks: [lab-internal]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  lab-internal:
    internal: true

secrets:
  postgres-user:
    environment: PHASE7_POSTGRES_USER
  postgres-password:
    environment: PHASE7_POSTGRES_PASSWORD
  object-store-user:
    environment: PHASE7_OBJECT_STORE_USER
  object-store-password:
    environment: PHASE7_OBJECT_STORE_PASSWORD
  service-api-credential:
    environment: PHASE7_SERVICE_API_CREDENTIAL
